name: Entra ID Client Secret Expiration Check

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1-5' # weekdays at 06:00 UTC

permissions:
  contents: read
  id-token: write

jobs:
  check-client-secrets:
    runs-on: ubuntu-latest
    env:
      ALERT_DAYS: '7'
      SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
      SENDGRID_FROM_EMAIL: ${{ secrets.SENDGRID_FROM_EMAIL }}
      SENDGRID_TO_EMAILS: ${{ secrets.SENDGRID_TO_EMAILS }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Sign in to Azure with federated credentials
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CHECKING_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Check client secret expiration dates
        id: check
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import base64
          import json
          import os
          import subprocess
          from datetime import datetime, timezone
          from urllib.parse import urlencode

          app_ids_file = "entra-app-ids.txt"
          if not os.path.isfile(app_ids_file):
              raise SystemExit(f"App ID list not found: {app_ids_file}")

          with open(app_ids_file, encoding="utf-8") as file:
              app_ids = [
                  line.split("#", 1)[0].strip()
                  for line in file
                  if line.split("#", 1)[0].strip()
              ]

          if not app_ids:
              raise SystemExit(f"No app IDs found in {app_ids_file}")

          now = datetime.now(timezone.utc)
          alert_days = int(os.environ["ALERT_DAYS"])
          alerts = []
          has_errors = False

          for app_id in app_ids:
              query = urlencode({
                  "$filter": f"appId eq '{app_id}'",
                  "$select": "appId,displayName,passwordCredentials",
              })
              url = f"https://graph.microsoft.com/v1.0/applications?{query}"

              result = subprocess.run(
                  ["az", "rest", "--method", "GET", "--url", url, "--output", "json"],
                  capture_output=True,
                  text=True,
              )

              if result.returncode != 0:
                  error = result.stderr.strip() or "Microsoft Graph request failed"
                  alerts.append({
                      "app_id": app_id,
                      "application": "",
                      "secret": "",
                      "credential_id": "",
                      "expiration": "",
                      "status": "CHECK FAILED",
                      "days_remaining": "",
                      "error": error,
                  })
                  has_errors = True
                  continue

              try:
                  response = json.loads(result.stdout or "{}")
              except json.JSONDecodeError as exc:
                  alerts.append({
                      "app_id": app_id,
                      "application": "",
                      "secret": "",
                      "credential_id": "",
                      "expiration": "",
                      "status": "CHECK FAILED",
                      "days_remaining": "",
                      "error": f"Invalid Microsoft Graph response: {exc}",
                  })
                  has_errors = True
                  continue

              applications = response.get("value", [])
              if len(applications) != 1:
                  alerts.append({
                      "app_id": app_id,
                      "application": "",
                      "secret": "",
                      "credential_id": "",
                      "expiration": "",
                      "status": "CHECK FAILED",
                      "days_remaining": "",
                      "error": f"Expected one application in this tenant, found {len(applications)}",
                  })
                  has_errors = True
                  continue

              application = applications[0]
              app_name = application.get("displayName") or app_id
              credentials = application.get("passwordCredentials") or []

              if not credentials:
                  print(f"{app_id} ({app_name}) | no password credentials returned")
                  continue

              for credential in credentials:
                  end_date = credential.get("endDateTime")
                  credential_id = credential.get("keyId") or "unknown"
                  name = credential.get("displayName") or "unnamed secret"

                  if not end_date:
                      alerts.append({
                          "app_id": app_id,
                          "application": app_name,
                          "secret": name,
                          "credential_id": credential_id,
                          "expiration": "",
                          "status": "CHECK FAILED",
                          "days_remaining": "",
                          "error": "Missing expiration date",
                      })
                      has_errors = True
                      continue

                  try:
                      expires = datetime.fromisoformat(end_date.replace("Z", "+00:00"))
                      if expires.tzinfo is None:
                          expires = expires.replace(tzinfo=timezone.utc)
                  except ValueError:
                      alerts.append({
                          "app_id": app_id,
                          "application": app_name,
                          "secret": name,
                          "credential_id": credential_id,
                          "expiration": end_date,
                          "status": "CHECK FAILED",
                          "days_remaining": "",
                          "error": "Invalid expiration date",
                      })
                      has_errors = True
                      continue

                  days_left = (expires - now).total_seconds() / 86400
                  if days_left <= 0:
                      status = "EXPIRED"
                  elif days_left <= alert_days:
                      status = "EXPIRING SOON"
                  else:
                      continue

                  alerts.append({
                      "app_id": app_id,
                      "application": app_name,
                      "secret": name,
                      "credential_id": credential_id,
                      "expiration": expires.strftime("%Y-%m-%d %H:%M UTC"),
                      "status": status,
                      "days_remaining": f"{days_left:.0f}",
                      "error": "",
                  })

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"has_alert={'true' if alerts else 'false'}\n")
              output.write(f"has_errors={'true' if has_errors else 'false'}\n")

              if alerts:
                  encoded = base64.b64encode(
                      json.dumps(alerts, ensure_ascii=False).encode("utf-8")
                  ).decode("ascii")
                  output.write(f"alerts_b64={encoded}\n")
                  for alert in alerts:
                      print(json.dumps(alert, ensure_ascii=False))
              else:
                  print(
                      "No client secrets are expired or expiring within "
                      f"{alert_days} days."
                  )
          PY

      - name: Send email through SendGrid
        if: steps.check.outputs.has_alert == 'true'
        env:
          ALERTS_B64: ${{ steps.check.outputs.alerts_b64 }}
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import base64
          import html
          import json
          import os
          import urllib.error
          import urllib.request

          api_key = os.environ.get("SENDGRID_API_KEY", "")
          sender = os.environ.get("SENDGRID_FROM_EMAIL", "")
          recipients = [
              address.strip()
              for address in os.environ.get("SENDGRID_TO_EMAILS", "").split(",")
              if address.strip()
          ]

          if not api_key or not sender or not recipients:
              raise SystemExit(
                  "Configure SENDGRID_API_KEY, SENDGRID_FROM_EMAIL, and SENDGRID_TO_EMAILS."
              )

          alerts = json.loads(base64.b64decode(os.environ["ALERTS_B64"]).decode("utf-8"))

          headers = [
              "Application",
              "Application ID",
              "Secret name",
              "Credential ID",
              "Expiration (UTC)",
              "Status",
              "Days remaining",
              "Error details",
          ]

          rows = []
          for alert in alerts:
              rows.append([
                  alert.get("application", ""),
                  alert.get("app_id", ""),
                  alert.get("secret", ""),
                  alert.get("credential_id", ""),
                  alert.get("expiration", ""),
                  alert.get("status", ""),
                  alert.get("days_remaining", ""),
                  alert.get("error", ""),
              ])

          def row_html(values):
              return "<tr>" + "".join(
                  f"<td style='border:1px solid #d0d7de;padding:8px 10px;vertical-align:top;'>{html.escape(str(v))}</td>"
                  for v in values
              ) + "</tr>"

          html_table = (
              "<table style='border-collapse:collapse;width:100%;font-family:Arial,sans-serif;font-size:12px;color:#24292f;'>"
              + "<thead>"
              + "<tr>"
              + "".join(
                  f"<th style='border:1px solid #d0d7de;padding:8px 10px;background:#f6f8fa;text-align:left;'>{html.escape(h)}</th>"
                  for h in headers
              )
              + "</tr>"
              + "</thead>"
              + "<tbody>"
              + "".join(row_html(r) for r in rows)
              + "</tbody>"
              + "</table>"
          )

          text_lines = [
              "Application | Application ID | Secret name | Credential ID | Expiration (UTC) | Status | Days remaining | Error details"
          ]
          for r in rows:
              text_lines.append(" | ".join(str(v) for v in r))

          text_body = (
              "The following Entra ID client secrets are expired, expiring soon, or could not be checked:\n\n"
              + "\n".join(text_lines)
              + "\n"
          )

          payload = {
              "personalizations": [
                  {"to": [{"email": address} for address in recipients]}
              ],
              "from": {"email": sender},
              "subject": "Entra ID client secret expiration alert",
              "content": [
                  {"type": "text/plain", "value": text_body},
                  {"type": "text/html", "value": html_table},
              ],
          }

          request = urllib.request.Request(
              "https://api.sendgrid.com/v3/mail/send",
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {api_key}",
                  "Content-Type": "application/json",
              },
              method="POST",
          )

          try:
              with urllib.request.urlopen(request) as response:
                  if response.status != 202:
                      raise SystemExit(f"SendGrid returned HTTP {response.status}")
                  print("SendGrid notification sent.")
          except urllib.error.HTTPError as error:
              detail = error.read().decode("utf-8", errors="replace")
              raise SystemExit(
                  f"SendGrid request failed: HTTP {error.code}: {detail}"
              )
          PY

      - name: Fail workflow if any app could not be checked
        if: steps.check.outputs.has_errors == 'true'
        shell: bash
        run: |
          echo "One or more applications could not be checked. See the check output and alert email."
          exit 1
