name: Entra ID Client Secret Expiration Check

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1-5' # weekdays at 06:00 UTC

permissions:
  contents: read
  id-token: write

jobs:
  check-client-secrets:
    runs-on: ubuntu-latest
    env:
      ALERT_DAYS: '7'
      SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
      SENDGRID_FROM_EMAIL: ${{ secrets.SENDGRID_FROM_EMAIL }}
      SENDGRID_TO_EMAILS: ${{ secrets.SENDGRID_TO_EMAILS }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Sign in to Azure with federated credentials
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Check client secret expiration dates
        id: check
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import base64
          import json
          import os
          import subprocess
          from datetime import datetime, timezone

          app_ids_file = "entra-app-ids.txt"
          if not os.path.isfile(app_ids_file):
              raise SystemExit(f"App ID list not found: {app_ids_file}")

          with open(app_ids_file, encoding="utf-8") as file:
              app_ids = [
                  line.split("#", 1)[0].strip()
                  for line in file
                  if line.split("#", 1)[0].strip()
              ]

          if not app_ids:
              raise SystemExit(f"No app IDs found in {app_ids_file}")

          now = datetime.now(timezone.utc)
          alert_days = int(os.environ["ALERT_DAYS"])
          alerts = []

          for app_id in app_ids:
              command = [
                  "az", "ad", "app", "credential", "list",
                  "--id", app_id,
                  "--query", "[?type=='Password'].{id:keyId,name:displayName,end:endDateTime}",
                  "--output", "json",
              ]
              result = subprocess.run(command, capture_output=True, text=True)

              if result.returncode != 0:
                  error = result.stderr.strip() or "Azure CLI request failed"
                  alerts.append(f"{app_id} | unable to check client secrets: {error}")
                  continue

              try:
                  credentials = json.loads(result.stdout or "[]")
              except json.JSONDecodeError as exc:
                  alerts.append(f"{app_id} | unable to parse credential data: {exc}")
                  continue

              for credential in credentials:
                  end_date = credential.get("end")
                  if not end_date:
                      continue

                  try:
                      expires = datetime.fromisoformat(end_date.replace("Z", "+00:00"))
                  except ValueError:
                      alerts.append(
                          f"{app_id} | secret {credential.get('id', 'unknown')} "
                          f"| invalid expiration date: {end_date}"
                      )
                      continue

                  days_left = (expires - now).total_seconds() / 86400
                  if days_left <= 0:
                      status = "EXPIRED"
                  elif days_left <= alert_days:
                      status = "EXPIRING SOON"
                  else:
                      continue

                  name = credential.get("name") or "unnamed secret"
                  alerts.append(
                      f"{app_id} | {name} | secret {credential.get('id', 'unknown')} "
                      f"| expires {end_date} | {status} | {days_left:.0f} days left"
                  )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              if alerts:
                  details = "\n".join(alerts)
                  encoded = base64.b64encode(details.encode("utf-8")).decode("ascii")
                  output.write("has_alert=true\n")
                  output.write(f"alerts_b64={encoded}\n")
                  print(details)
              else:
                  output.write("has_alert=false\n")
                  print(f"No client secrets are expired or expiring within {alert_days} days.")
          PY

      - name: Send email through SendGrid
        if: steps.check.outputs.has_alert == 'true'
        env:
          ALERTS_B64: ${{ steps.check.outputs.alerts_b64 }}
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.error
          import urllib.request

          api_key = os.environ.get("SENDGRID_API_KEY", "")
          sender = os.environ.get("SENDGRID_FROM_EMAIL", "")
          recipients = [
              address.strip()
              for address in os.environ.get("SENDGRID_TO_EMAILS", "").split(",")
              if address.strip()
          ]

          if not api_key or not sender or not recipients:
              raise SystemExit(
                  "Configure SENDGRID_API_KEY, SENDGRID_FROM_EMAIL, and SENDGRID_TO_EMAILS."
              )

          alerts = base64.b64decode(os.environ["ALERTS_B64"]).decode("utf-8")
          payload = {
              "personalizations": [
                  {"to": [{"email": address} for address in recipients]}
              ],
              "from": {"email": sender},
              "subject": "Entra ID client secret expiration alert",
              "content": [{
                  "type": "text/plain",
                  "value": (
                      "The following Entra ID application client secrets are expired, "
                      "expiring within 7 days, or could not be checked:\n\n"
                      f"{alerts}\n"
                  ),
              }],
          }

          request = urllib.request.Request(
              "https://api.sendgrid.com/v3/mail/send",
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {api_key}",
                  "Content-Type": "application/json",
              },
              method="POST",
          )

          try:
              with urllib.request.urlopen(request) as response:
                  if response.status != 202:
                      raise SystemExit(f"SendGrid returned HTTP {response.status}")
                  print("SendGrid notification sent.")
          except urllib.error.HTTPError as error:
              detail = error.read().decode("utf-8", errors="replace")
              raise SystemExit(f"SendGrid request failed: HTTP {error.code}: {detail}")
          PY
