name: Sync Azure Storage

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write
  id-token: write

jobs:
  sync:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Sign in to Azure with federated credentials
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install AzCopy
        run: |
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          wget -O "$temp_dir/azcopy.tar.gz" https://aka.ms/downloadazcopy-v10-linux
          tar -xf "$temp_dir/azcopy.tar.gz" -C "$temp_dir"
          sudo cp "$temp_dir"/azcopy_linux_amd64_*/azcopy /usr/local/bin/

      - name: Validate Azure access
        env:
          AZURE_STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT }}
          AZURE_STORAGE_CONTAINER: ${{ secrets.AZURE_STORAGE_CONTAINER }}
        run: |
          az storage container exists \
            --account-name "$AZURE_STORAGE_ACCOUNT" \
            --name "$AZURE_STORAGE_CONTAINER" \
            --auth-mode login

      - name: Clear synced folders
        run: |
          rm -rf -- ./log ./config ./bin

      - name: Download and extract archives
        env:
          AZURE_STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT }}
          AZURE_STORAGE_CONTAINER: ${{ secrets.AZURE_STORAGE_CONTAINER }}
        run: |
          download_dir="$(mktemp -d)"
          trap 'rm -rf "$download_dir"' EXIT

          az storage blob download-batch \
            --account-name "$AZURE_STORAGE_ACCOUNT" \
            --source "$AZURE_STORAGE_CONTAINER" \
            --destination "$download_dir" \
            --auth-mode login \
            --overwrite

          for folder in log config bin; do
            archive="$download_dir/$folder.zip"
            if [ -f "$archive" ]; then
              mkdir -p "./$folder"
              unzip -o "$archive" -d "./$folder"
            fi
          done

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A -- log config bin
          git diff --cached --quiet || git commit -m "Automatic sync from Azure Storage"

      - name: Push changes
        run: |
          git push
